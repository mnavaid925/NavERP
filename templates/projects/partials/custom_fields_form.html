{% if form.custom_fields %}
  <div class="card mt-6">
    <div class="card-header"><h2>Custom fields</h2></div>
    <div class="card-body">
      <div class="form-grid">
        {% for field in form.custom_fields %}
          <div class="form-group">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.custom_required %} <span class="req">*</span>{% endif %}</label>
            {{ field }}
            {% if field.help_text %}<div class="form-help">{{ field.help_text }}</div>{% endif %}
            {% for error in field.errors %}<div class="form-error">{{ error }}</div>{% endfor %}
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
{% endif %}
